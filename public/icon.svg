<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Primary Emerald-to-Teal Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glass Reflection Glow -->
    <linearGradient id="lensGlow" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Solid Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Aperture Ring -->
  <circle cx="240" cy="236" r="148" fill="none" stroke="#1e293b" stroke-width="14" />
  <circle cx="240" cy="236" r="148" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-dasharray="40 18" stroke-linecap="round" />

  <!-- Inner Lens Glass -->
  <circle cx="240" cy="236" r="126" fill="url(#lensGlow)" stroke="#0f172a" stroke-width="6" />

  <!-- Camera Aperture Diaphragm Blades -->
  <g stroke="#0f172a" stroke-width="4" opacity="0.85">
    <path d="M 240 110 L 290 200 L 255 200 Z" fill="#10b981" />
    <path d="M 366 236 L 276 286 L 276 251 Z" fill="#059669" />
    <path d="M 240 362 L 190 272 L 225 272 Z" fill="#0d9488" />
    <path d="M 114 236 L 204 186 L 204 221 Z" fill="#14b8a6" />
  </g>

  <!-- Central Scout Aperture Target -->
  <circle cx="240" cy="236" r="46" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" />
  <circle cx="240" cy="236" r="16" fill="url(#primaryGrad)" />

  <!-- Magnifying Scout Glass Handle -->
  <path d="M 334 330 L 404 400" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" />
  <path d="M 334 330 L 404 400" stroke="#0f172a" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <circle cx="404" cy="400" r="13" fill="#34d399" />

  <!-- Discovery Sparkle Stars (Trend Signals) -->
  <g fill="url(#accentGrad)">
    <!-- Top-Right Sparkle -->
    <path d="M 374 134 Q 374 158 398 158 Q 374 158 374 182 Q 374 158 350 158 Q 374 158 374 134 Z" />
    <!-- Bottom-Left Mini Sparkle -->
    <path d="M 126 316 Q 126 330 140 330 Q 126 330 126 344 Q 126 330 112 330 Q 126 330 126 316 Z" opacity="0.8" />
  </g>

  <!-- Lens Flare Reflection Arc -->
  <path d="M 166 186 A 88 88 0 0 1 236 150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6" />
</svg>
